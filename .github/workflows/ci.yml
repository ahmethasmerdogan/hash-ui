name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs are capped. A hung step — `playwright install` waiting on apt has
# done it — otherwise sits there until the six-hour default, holding a runner
# and telling nobody anything.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build both npm packages
        run: npm run build:lib

      - name: Build the registry and the docs site
        run: npm run build

      - name: Registry is in sync with the source
        run: git diff --exit-code apps/docs/public/r apps/docs/src/lib/registry-items.ts

      # Every README and both manifests state how many components, blocks and
      # icons there are. Those numbers were wrong three times, in both
      # directions — prose drifting from the source, and the source growing
      # past the prose.
      - name: The numbers in the prose are true
        run: node scripts/counts.mjs

      # The npm route is covered by `typecheck`. This covers the other one:
      # lay every registry item out where the CLI would put it and compile it
      # there, with the real optional peers installed rather than our shims.
      - name: The copied source compiles
        run: node scripts/verify-registry.mjs

      # core's pitch is that it imports nothing but React; that claim has a
      # weight attached, and a stray dependency would otherwise only show up
      # in somebody else's bundle analyser
      - name: Size budget
        run: node scripts/size.mjs

  qa:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # the browser only; --with-deps pulls apt packages the runner image
      # already ships, and is where this job has hung before
      - run: npx playwright install chromium

      - name: Serve the built site
        run: |
          npm run build
          npx --yes serve -s apps/docs/dist -l 5180 &
          npx --yes wait-on http://localhost:5180 -t 60000

      # every route × both themes: overflow, contrast, the no-shadow rule,
      # then the interactive surfaces (⌘K, modal, toast, registry JSON)
      - name: Route sweep
        run: node scripts/qa.mjs
        env:
          QA_URL: http://localhost:5180

      # A screenshot cannot tell a working animation from a frozen one, which
      # is how blocks have shipped before now looking finished and sitting
      # still. Each check photographs one element twice and fails on too few
      # changed pixels. The Spline scene is skipped here: it is fetched from a
      # third-party CDN and would fail for reasons unrelated to the commit.
      - name: Motion sweep
        run: node scripts/motion.mjs
        env:
          QA_URL: http://localhost:5180
          MOTION_SKIP: spline

      - name: Accessible-name sweep
        run: node scripts/a11y.mjs
        env:
          QA_URL: http://localhost:5180

      # WCAG 1.4.10: every route must reflow to 320px without a horizontal
      # scrollbar. Screenshots never caught this — the page looks right, it
      # is simply wider than the window it is in.
      - name: Reflow sweep
        run: node scripts/reflow.mjs
        env:
          BASE_URL: http://localhost:5180

      # 2.5.8 is mostly its exceptions — a small control with room around it
      # passes. Checking the size alone reports 49 violations here, none of
      # which are violations.
      - name: Target-size sweep
        run: node scripts/targets.mjs
        env:
          BASE_URL: http://localhost:5180

      # The same suite with the setting on, and every assertion inverted:
      # anything that still moves is the failure. A system that claims to
      # respect reduced motion should be checked under it.
      - name: Motion sweep (reduced motion)
        run: node scripts/motion.mjs
        env:
          QA_URL: http://localhost:5180
          MOTION_SKIP: spline
          MOTION_REDUCED: "1"
