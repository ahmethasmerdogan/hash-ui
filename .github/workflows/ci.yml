name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs are capped. A hung step — `playwright install` waiting on apt has
# done it — otherwise sits there until the six-hour default, holding a runner
# and telling nobody anything.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build both npm packages
        run: npm run build:lib

      - name: Build the registry and the docs site
        run: npm run build

      - name: Registry is in sync with the source
        run: git diff --exit-code apps/docs/public/r apps/docs/src/lib/registry-items.ts

  qa:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # the browser only; --with-deps pulls apt packages the runner image
      # already ships, and is where this job has hung before
      - run: npx playwright install chromium

      - name: Serve the built site
        run: |
          npm run build
          npx --yes serve -s apps/docs/dist -l 5180 &
          npx --yes wait-on http://localhost:5180 -t 60000

      # every route × both themes: overflow, contrast, the no-shadow rule,
      # then the interactive surfaces (⌘K, modal, toast, registry JSON)
      - name: Route sweep
        run: node scripts/qa.mjs
        env:
          QA_URL: http://localhost:5180

      # A screenshot cannot tell a working animation from a frozen one, which
      # is how blocks have shipped before now looking finished and sitting
      # still. Each check photographs one element twice and fails on too few
      # changed pixels. The Spline scene is skipped here: it is fetched from a
      # third-party CDN and would fail for reasons unrelated to the commit.
      - name: Motion sweep
        run: node scripts/motion.mjs
        env:
          QA_URL: http://localhost:5180
          MOTION_SKIP: spline

      # The same suite with the setting on, and every assertion inverted:
      # anything that still moves is the failure. A system that claims to
      # respect reduced motion should be checked under it.
      - name: Motion sweep (reduced motion)
        run: node scripts/motion.mjs
        env:
          QA_URL: http://localhost:5180
          MOTION_SKIP: spline
          MOTION_REDUCED: "1"
